<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>校园二手 · 验收台</title>
    <style>
        [hidden] { display: none !important; }
        :root {
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #b91c1c;
            --success: #15803d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
            font-size: 14px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .brand { font-size: 18px; font-weight: 700; }
        .brand .sub { margin-left: 8px; font-size: 12px; font-weight: 400; color: var(--muted); }
        .userbox { display: flex; align-items: center; gap: 8px; }
        .chip {
            background: #eef2f7;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 13px;
            color: #334155;
        }
        .countdown {
            background: #fff7ed;
            color: #b45309;
            border: 1px solid #fed7aa;
            font-variant-numeric: tabular-nums;
        }
        .countdown.timeout {
            background: #fee2e2;
            color: #b91c1c;
            border-color: #fecaca;
        }
        .wrap { max-width: 1080px; margin: 24px auto 60px; padding: 0 16px; }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
        }
        .auth { margin-bottom: 18px; }
        .auth-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
        .auth-head h2 { margin: 0; font-size: 18px; }
        .link {
            border: 0;
            background: none;
            color: var(--primary);
            cursor: pointer;
            padding: 0;
            font-size: 13px;
        }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
        label.full { margin-top: 12px; }
        input, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text);
            background: #fff;
            font-family: inherit;
        }
        textarea { resize: vertical; }
        input:focus, textarea:focus { outline: 2px solid #bfdbfe; border-color: var(--primary); }
        .btn {
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            background: #eef2f7;
            color: var(--text);
            white-space: nowrap;
        }
        .btn:hover { filter: brightness(0.97); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn.primary { background: var(--primary); color: #fff; }
        .btn.primary:hover { background: var(--primary-dark); }
        .btn.ghost { background: #fff; border-color: var(--line); }
        .btn.small { padding: 5px 10px; font-size: 13px; }
        .hint { color: var(--muted); font-size: 13px; }
        .tabs { display: flex; gap: 8px; margin: 18px 0; flex-wrap: wrap; }
        .tab {
            border: 1px solid var(--line);
            background: #fff;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
        }
        .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .badge {
            display: inline-block;
            min-width: 18px;
            padding: 0 5px;
            margin-left: 4px;
            border-radius: 999px;
            background: #e2e8f0;
            color: #334155;
            font-size: 12px;
            text-align: center;
        }
        .tab.active .badge { background: rgba(255,255,255,.25); color: #fff; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .toolbar .grow { flex: 1; min-width: 200px; }
        .toolbar .narrow { width: 150px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .item { padding: 12px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
        .cover {
            height: 150px;
            border-radius: 8px;
            background: #eef2f7;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 13px;
        }
        .cover img { width: 100%; height: 100%; object-fit: cover; }
        .item-body h3 { margin: 0; font-size: 15px; line-height: 1.4; }
        .own-tag {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 999px;
            background: #ecfdf5;
            color: #047857;
            font-size: 11px;
            font-weight: 600;
            vertical-align: middle;
        }
        .price { font-size: 18px; font-weight: 700; color: #dc2626; }
        .price s { margin-left: 6px; font-size: 12px; font-weight: 400; color: #94a3b8; }
        .meta { font-size: 12px; color: var(--muted); }
        .actions { display: flex; gap: 8px; margin-top: auto; }
        .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; }
        .empty {
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            color: var(--muted);
            background: #fbfcfe;
        }
        .form-card h2 { margin: 0 0 14px; font-size: 18px; }
        .cover-preview { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
        .cover-preview img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
        .message-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
        .message-head h2 { margin: 0; font-size: 18px; }
        .messages { display: flex; flex-direction: column; gap: 10px; }
        .message { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
        .message-meta { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
        .message-meta b { color: #334155; }
        .message-meta .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; }
        .avatar-fallback {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 600;
        }
        .message.unread { border-left: 3px solid #2563eb; }
        .message-item { margin: 4px 0 6px; font-size: 12px; color: #64748b; }
        .message-actions { margin-top: 8px; display: flex; justify-content: flex-end; }
        .message-content { white-space: pre-wrap; word-break: break-word; }
        .send-row { display: flex; gap: 10px; margin-top: 14px; }
        .send-row input { flex: 1; }
        .footnote { margin-top: 26px; text-align: center; color: #94a3b8; font-size: 12px; }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            padding: 10px 16px;
            border-radius: 10px;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            z-index: 99;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .2);
        }
        .toast.error { background: var(--danger); }
        .toast.success { background: var(--success); }
        .modal {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, .5);
        }
        .modal-card {
            position: relative;
            width: min(560px, 100%);
            max-height: 86vh;
            overflow: auto;
            padding: 22px;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 20px 60px rgba(15, 23, 42, .3);
        }
        .modal-close {
            position: absolute;
            top: 8px;
            right: 12px;
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
        }
        .modal-card h2 { margin: 7px 0 4px; padding-right: 24px; font-size: 20px; line-height: 1.4; }
        .detail-cover {
            width: 100%;
            max-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 10px;
            background: #eef2f7;
            color: #94a3b8;
            font-size: 13px;
        }
        .detail-cover img { width: 100%; max-height: 300px; object-fit: cover; }
        .detail-desc { margin: 12px 0 16px; white-space: pre-wrap; line-height: 1.7; color: #334155; }
        @media (max-width: 620px) {
            .grid2 { grid-template-columns: 1fr; }
            .topbar { padding: 12px 16px; }
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="brand">校园二手 · 验收台<span class="sub">campus-trade</span></div>
    <div class="userbox">
        <span id="userChip" class="chip">未登录</span>
        <button id="logoutBtn" class="btn ghost small" hidden>退出</button>
    </div>
</header>

<main class="wrap">
    <section id="loginPanel" class="card auth">
        <div class="auth-head">
            <h2 id="authTitle">登录</h2>
            <button id="switchAuth" class="link">没有账号？去注册</button>
        </div>
        <div class="grid2">
            <label>用户名
                <input id="username" value="verify01" autocomplete="username">
            </label>
            <label>密码
                <input id="password" type="password" value="123456" autocomplete="current-password">
            </label>
        </div>
        <div id="registerFields" class="grid2" hidden>
            <label>昵称
                <input id="nickname" placeholder="显示给其他用户">
            </label>
            <label>学校
                <input id="school" value="辽宁工程技术大学">
            </label>
        </div>
        <div class="row">
            <button id="authSubmit" class="btn primary">登录</button>
            <span id="authHint" class="hint">测试账号：verify01 / 123456</span>
        </div>
    </section>

    <nav class="tabs">
        <button class="tab active" data-tab="items">商品</button>
        <button class="tab" data-tab="publish">发布商品</button>
        <button class="tab" data-tab="favorites">我的收藏<span id="favCount" class="badge">0</span></button>
        <button class="tab" data-tab="messages">留言</button>
        <button class="tab" data-tab="received">收到的留言<span id="unreadBadge" class="badge" hidden>0</span></button>
        <button class="tab" data-tab="orders">我的订单</button>
    </nav>

    <section id="tab-items" class="tab-panel">
        <div class="toolbar">
            <input id="keyword" class="grow" placeholder="搜标题，例如：自行车">
            <input id="categoryId" class="narrow" placeholder="分类 id（可空）">
            <button id="searchBtn" class="btn primary">搜索</button>
            <button id="resetBtn" class="btn ghost">重置</button>
        </div>
        <div id="itemList" class="grid"></div>
        <div class="pager">
            <button id="prevPage" class="btn ghost" disabled>上一页</button>
            <span id="pageInfo" class="hint">第 1 / 1 页</span>
            <button id="nextPage" class="btn ghost" disabled>下一页</button>
        </div>
    </section>

    <section id="tab-publish" class="tab-panel" hidden>
        <div class="card form-card">
            <h2>发布商品</h2>
            <div class="grid2">
                <label>标题 *
                    <input id="pTitle" placeholder="二手自行车">
                </label>
                <label>价格 *
                    <input id="pPrice" placeholder="120.00">
                </label>
                <label>原价
                    <input id="pOriginalPrice" placeholder="399.00">
                </label>
                <label>分类 id
                    <input id="pCategoryId" placeholder="1">
                </label>
                <label>校区
                    <input id="pSchool" value="辽宁工程技术大学">
                </label>
                <label>封面图
                    <input id="pCoverFile" type="file" accept="image/*">
                </label>
            </div>
            <label class="full">描述
                <textarea id="pDescription" rows="3" placeholder="九成新，可小刀"></textarea>
            </label>
            <div id="coverPreview" class="cover-preview" hidden></div>
            <div class="row">
                <button id="publishBtn" class="btn primary">发布</button>
                <span id="publishHint" class="hint">封面可不上传；上传后会自动填入</span>
            </div>
        </div>
    </section>

    <section id="tab-favorites" class="tab-panel" hidden>
        <div id="favoriteList" class="grid"></div>
        <div id="favoriteEmpty" class="empty" hidden>还没有收藏，去「商品」页逛逛。</div>
    </section>

    <section id="tab-messages" class="tab-panel" hidden>
        <div id="messageEmpty" class="empty">从「商品」页点某个商品的「留言」，这里会显示该商品的留言。</div>
        <div id="messagePanel" hidden>
            <div class="message-head">
                <h2 id="messageTitle"></h2>
                <button id="backToItems" class="link">返回商品列表</button>
            </div>
            <div id="messageList" class="messages"></div>
            <div class="send-row">
                <input id="messageInput" placeholder="输入留言，例如：还在吗？">
                <button id="sendBtn" class="btn primary">发送</button>
            </div>
        </div>
    </section>

    <section id="tab-received" class="tab-panel" hidden>
        <div class="toolbar">
            <button id="refreshReceived" class="btn ghost">刷新</button>
            <button id="readAllBtn" class="btn ghost">全部标为已读</button>
            <span id="receivedHint" class="hint"></span>
        </div>
        <div id="receivedList" class="messages"></div>
    </section>

    <section id="tab-orders" class="tab-panel" hidden>
        <div class="toolbar">
            <button id="boughtBtn" class="btn primary">我买到的</button>
            <button id="soldBtn" class="btn ghost">我卖出的</button>
            <button id="refreshOrders" class="btn ghost">刷新</button>
            <span class="hint">待确认的订单由卖家确认；未完成的订单买卖双方都可取消。</span>
        </div>
        <div id="orderList" class="grid"></div>
        <div id="orderEmpty" class="empty" hidden>暂无订单</div>
    </section>

    <p class="footnote">这是本地验收页，不是真实前端。第 4 轮支持收藏/留言/未读；第 5 轮支持商品下单、我买到的/我卖出的、卖家确认与取消。</p>
</main>

<div id="detailModal" class="modal" hidden>
    <div class="modal-card">
        <button id="closeDetail" class="modal-close" type="button" aria-label="关闭">×</button>
        <div id="detailBody"></div>
    </div>
</div>

<div id="editModal" class="modal" hidden>
    <div class="modal-card">
        <button id="closeEdit" class="modal-close" type="button" aria-label="关闭">×</button>
        <h2>编辑商品</h2>
        <div class="grid2">
            <label>标题 *
                <input id="eTitle" placeholder="二手自行车">
            </label>
            <label>价格 *
                <input id="ePrice" placeholder="120.00">
            </label>
            <label>原价
                <input id="eOriginalPrice" placeholder="399.00">
            </label>
            <label>分类 id
                <input id="eCategoryId" placeholder="1">
            </label>
            <label>校区
                <input id="eSchool" placeholder="辽宁工程技术大学">
            </label>
            <label>封面图地址
                <input id="eCoverImage" placeholder="/uploads/xxx.png">
            </label>
        </div>
        <label class="full">描述
            <textarea id="eDescription" rows="3" placeholder="九成新，可小刀"></textarea>
        </label>
        <div class="actions">
            <button id="saveEdit" class="btn primary" type="button">保存修改</button>
            <button id="cancelEdit" class="btn ghost" type="button">取消</button>
        </div>
    </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
    const $ = id => document.getElementById(id);

    const state = {
        token: localStorage.getItem('token') || '',
        username: localStorage.getItem('username') || '',
        userId: null,
        items: [],
        itemPage: 1,
        itemPages: 1,
        favorites: new Set(),
        currentItem: null,
        detailItem: null,
        editingItem: null,
        orders: [],
        orderMode: 'bought',
        authMode: 'login'
    };

    function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    function money(value) {
        const n = Number(value);
        return Number.isFinite(n) ? '¥' + n.toFixed(2) : esc(value);
    }

    function formatTime(value) {
        return value ? String(value).replace('T', ' ').slice(0, 16) : '';
    }

    function orderStatusText(status) {
        return { 0: '待确认', 1: '已确认', 2: '已取消', 3: '已完成' }[Number(status)] || '未知状态';
    }

    function itemStatusText(status) {
        return { 0: '已下架', 1: '在售', 2: '交易中' }[Number(status)] || '未知状态';
    }

    function isMine(item) {
        return item.sellerId != null && state.userId != null && Number(item.sellerId) === state.userId;
    }

    function manageButtons(item) {
        if (!isMine(item)) return '';
        const status = Number(item.status);
        if (status === 2) return '<button class="btn ghost small" disabled>交易中</button>';
        const buttons = [`<button class="btn ghost small" data-action="edit-item" data-id="${item.id}">编辑</button>`];
        if (status === 1) {
            buttons.push(`<button class="btn ghost small" data-action="off-item" data-id="${item.id}">下架</button>`);
        } else if (status === 0) {
            buttons.push(`<button class="btn primary small" data-action="on-item" data-id="${item.id}">重新上架</button>`);
        }
        return buttons.join('');
    }

    function openEdit(item) {
        state.editingItem = item;
        $('eTitle').value = item.title || '';
        $('ePrice').value = item.price == null ? '' : String(item.price);
        $('eOriginalPrice').value = item.originalPrice == null ? '' : String(item.originalPrice);
        $('eCategoryId').value = item.categoryId == null ? '' : String(item.categoryId);
        $('eSchool').value = item.school || '';
        $('eCoverImage').value = item.coverImage || '';
        $('eDescription').value = item.description || '';
        $('editModal').hidden = false;
        document.body.style.overflow = 'hidden';
    }

    function closeEdit() {
        $('editModal').hidden = true;
        document.body.style.overflow = '';
        state.editingItem = null;
    }

    async function saveEdit() {
        if (!state.editingItem) return;
        const title = $('eTitle').value.trim();
        const price = $('ePrice').value.trim();
        if (!title) return toast('标题不能为空', 'error');
        if (!price || Number(price) <= 0) return toast('价格必须大于 0', 'error');
        const categoryId = $('eCategoryId').value.trim();
        if (categoryId && !/^\d+$/.test(categoryId)) return toast('分类 id 必须是数字', 'error');
        const itemId = state.editingItem.id;
        const body = {
            title,
            description: $('eDescription').value.trim(),
            price,
            originalPrice: $('eOriginalPrice').value.trim() || null,
            coverImage: $('eCoverImage').value.trim(),
            school: $('eSchool').value.trim(),
            categoryId: categoryId ? Number(categoryId) : null
        };
        $('saveEdit').disabled = true;
        try {
            await api('/api/item/' + itemId + '/edit', { method: 'PUT', body: JSON.stringify(body) });
            toast('商品已更新', 'success');
            closeEdit();
            await loadItems(state.itemPage);
            if (!$('detailModal').hidden) openDetail(itemId);
        } catch (e) {
            toast(e.message, 'error');
        } finally {
            $('saveEdit').disabled = false;
        }
    }

    async function changeItemStatus(item, status) {
        if (!item) return;
        const label = status === 0 ? '下架' : '重新上架';
        if (!window.confirm(`确定${label}「${item.title}」吗？`)) return;
        try {
            await api('/api/item/' + item.id + '/status', {
                method: 'PUT',
                body: JSON.stringify({ status })
            });
            toast(`商品已${label}`, 'success');
            await loadItems(state.itemPage);
            if (!$('detailModal').hidden) openDetail(item.id);
        } catch (e) {
            toast(e.message, 'error');
        }
    }

    function sellerLabel(item) {
        if (item.sellerNickname) return item.sellerNickname;
        if (item.sellerId != null) return '用户 ' + item.sellerId;
        return '卖家信息待补';
    }

    function avatarHtml(url, name) {
        if (url) return `<img class="avatar" src="${esc(url)}" alt="">`;
        const initial = String(name || '?').trim().charAt(0) || '?';
        return `<span class="avatar avatar-fallback">${esc(initial)}</span>`;
    }

    async function openDetail(id) {
        try {
            const item = await api('/api/item/' + id);
            state.detailItem = item;
            renderDetail(item);
            $('detailModal').hidden = false;
            document.body.style.overflow = 'hidden';
        } catch (e) {
            toast(e.message, 'error');
        }
    }

    function renderDetail(item) {
        const mine = isMine(item);
        const favored = state.favorites.has(item.id);
        const sellerName = sellerLabel(item);
        $('detailBody').innerHTML = `
            <div class="detail-cover">${item.coverImage
                ? `<img src="${esc(item.coverImage)}" alt="${esc(item.title)}">`
                : '暂无封面'}</div>
            <h2>${esc(item.title)}${mine ? '<span class="own-tag">我发布的</span>' : ''}</h2>
            <div class="price">${money(item.price)}${item.originalPrice ? `<s>${money(item.originalPrice)}</s>` : ''}</div>

    async function handleDetailAction(event) {
        const button = event.target.closest('button[data-action]');
        if (!button || !state.detailItem) return;
        const id = state.detailItem.id;
        if (button.dataset.action === 'detail-fav') {
            await setFavorite(id, !state.favorites.has(id));
            renderDetail(state.detailItem);
        } else if (button.dataset.action === 'detail-msg') {
            const item = state.detailItem;
            closeDetail();
            openMessages(item.id);
        } else if (button.dataset.action === 'detail-order') {
            const item = state.detailItem;
            closeDetail();
            await createOrder(item.id);
        } else if (button.dataset.action === 'edit-item') {
            openEdit(state.detailItem);
        } else if (button.dataset.action === 'off-item') {
            await changeItemStatus(state.detailItem, 0);
        } else if (button.dataset.action === 'on-item') {
            await changeItemStatus(state.detailItem, 1);
        }
    }

    function decodeToken(token) {
        try {
            const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
            const text = decodeURIComponent(Array.prototype.map.call(atob(padded), ch =>
                '%' + ('00' + ch.charCodeAt(0).toString(16)).slice(-2)
            ).join(''));
            return JSON.parse(text);
        } catch (e) {
            return null;
        }
    }

    let toastTimer;
    function toast(message, type = '') {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast ' + type;
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
    }

    async function api(path, options = {}) {
        const headers = new Headers(options.headers || {});
        if (options.body && !(options.body instanceof FormData) && !headers.has('Content-Type')) {
            headers.set('Content-Type', 'application/json');
        }
        if (state.token) {
            headers.set('Authorization', 'Bearer ' + state.token);
        }
        const response = await fetch(path, { ...options, headers });
        const text = await response.text();
        let json = null;
        if (text) {
            try { json = JSON.parse(text); } catch (e) { /* 非 JSON 响应 */ }
        }
        if (response.status === 401 || (json && json.code === 401)) {
            clearSession(true);
            throw new Error('登录已过期，请重新登录');
        }
        if (!json) {
            throw new Error('服务器返回异常（HTTP ' + response.status + '）');
        }
        if (json.code !== 200) {
            throw new Error(json.message || ('请求失败（code=' + json.code + '）'));
        }
        return json.data;
    }

    function restoreSession() {
        if (!state.token) return;
        const payload = decodeToken(state.token);
        if (!payload || (payload.exp && payload.exp * 1000 <= Date.now())) {
            clearSession(true);
            return;
        }
        state.username = payload.username || localStorage.getItem('username') || '用户';
        state.userId = Number(payload.sub) || null;
        $('userChip').textContent = state.username + ' · 已登录';
        $('logoutBtn').hidden = false;

            return;

        try {
            const token = await api('/api/user/login', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });
            const payload = decodeToken(token) || {};
            state.token = token;
            state.username = payload.username || username;
            state.userId = Number(payload.sub) || null;
            localStorage.setItem('token', token);
            localStorage.setItem('username', state.username);
            $('userChip').textContent = state.username + ' · 已登录';
            $('logoutBtn').hidden = false;
            $('loginPanel').hidden = true;

    let countdownTimer = null;
    let reloadScheduled = false;

    function pad2(n) {
        return n < 10 ? '0' + n : String(n);
    }

    /** 每秒刷新一次所有订单卡片上的"剩余 xx:xx" */
    function tickCountdown() {
        let expired = false;
        document.querySelectorAll('[data-expire]').forEach(el => {
            // 后端给的是 LocalDateTime 字符串，如 2026-11-19T16:26:13；换掉 T 让各浏览器都按本地时间解析
            const end = new Date(String(el.dataset.expire).replace('T', ' ')).getTime();
            if (!end) return;
            const left = Math.floor((end - Date.now()) / 1000);
            if (left > 0) {
                el.textContent = '剩 ' + pad2(Math.floor(left / 60)) + ':' + pad2(left % 60);
                el.classList.remove('timeout');
            } else {
                el.textContent = '已超时';
                el.classList.add('timeout');
                expired = true;
            }
        });
        // 前端只负责显示：真正的取消由后端完成（MQ 死信消息 + 兜底任务），
        // 所以到点后等 3 秒再重拉列表，让用户看到"已取消"的结果
        if (expired && !reloadScheduled) {
            reloadScheduled = true;
            setTimeout(() => {
                reloadScheduled = false;
                if (state.token && !$('tab-orders').hidden) loadOrders();
            }, 3000);
        }
    }

    function startCountdown() {
        if (countdownTimer) return;
        countdownTimer = setInterval(() => {
            if (!document.hidden) tickCountdown();
        }, 1000);
    }

    async function goPay(orderId) {
        if (!state.token) {
            toast('请先登录', 'error');
            showLogin();
            return;
        }
        // 不用新窗口（会被浏览器当弹窗拦截）：拿到支付宝表单后直接写进当前标签页，
        // 表单里有自动 submit 的脚本，会自己跳到收银台
        try {
            const res = await fetch('/api/pay/page?orderId=' + encodeURIComponent(orderId), {
                headers: { 'Authorization': 'Bearer ' + state.token }
            });
            const text = await res.text();
            // 正常情况下返回的是支付宝表单 HTML；如果返回的不是 HTML（比如 {code:403,...}），
            // 说明是业务异常，提示出来，不要写进页面
            if (!res.ok || !/^\s*</.test(text)) {
                let msg = text;
                try { const json = JSON.parse(text); msg = json.message || text; } catch (e) { /* 不是 JSON 就原样显示 */ }
                toast(msg || ('发起支付失败（HTTP ' + res.status + '）'), 'error');
                return;
            }
            document.open();
            document.write(text);   // 表单自动 submit → 跳到支付宝收银台
            document.close();
        } catch (e) {
            toast('发起支付失败：' + e.message, 'error');
        }
    }

        switchTab('messages');
        $('messageEmpty').hidden = true;
        $('messagePanel').hidden = false;
        $('messageTitle').textContent = item.title + '（id=' + item.id + '）';
        $('messageInput').value = '';
        loadMessages();
    }

    async function loadMessages() {
        if (!state.currentItem) return;
        $('messageList').innerHTML = '<div class="empty">加载中...</div>';
        try {
            const data = await api('/api/message/item/' + state.currentItem.id + '?page=1&size=20');
            const records = data.records || [];
            $('messageList').innerHTML = records.length
                ? records.map(msg => `
                    <div class="message">
                        <div class="message-meta">
                            <span class="who">${avatarHtml(msg.fromAvatar, msg.fromNickName || ('用户 ' + msg.fromUserId))}<b>${esc(msg.fromNickName || ('用户 ' + msg.fromUserId))}</b></span>
                            <time>${formatTime(msg.createTime)}</time>
                        </div>
                        <div class="message-content">${esc(msg.content)}</div>
                    </div>`).join('')
                : '<div class="empty">还没有留言，来抢沙发。</div>';
        } catch (e) {
            $('messageList').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
        }
    }

    async function sendMessage() {
        if (!state.token) {
            toast('请先登录', 'error');
            showLogin();
            return;
        }
        if (!state.currentItem) return;
        if (isMine(state.currentItem)) {
            toast('不能给自己的商品留言', 'error');
            return;
        }
        const content = $('messageInput').value.trim();
        if (!content) {
            toast('留言内容不能为空', 'error');
            return;
        }
        try {
            await api('/api/message', {
                method: 'POST',
                body: JSON.stringify({ itemId: state.currentItem.id, content })
            });
            $('messageInput').value = '';
            toast('留言已发送', 'success');
            await loadMessages();
        } catch (e) {
            toast(e.message, 'error');
        }
    }

    async function loadUnreadCount() {
        if (!state.token) {
            $('unreadBadge').hidden = true;
            return;
        }
        try {
            const count = await api('/api/message/unread-count');
            const n = Number(count) || 0;
            $('unreadBadge').textContent = String(n);
            $('unreadBadge').hidden = n === 0;
        } catch (e) {
            $('unreadBadge').hidden = true;
        }
    }

    async function loadReceived() {
        if (!state.token) {
            $('receivedList').innerHTML = '<div class="empty">登录后才能查看收到的留言。</div>';
            $('receivedHint').textContent = '';
            return;
        }
        $('receivedList').innerHTML = '<div class="empty">加载中...</div>';
        try {
            const data = await api('/api/message/received?page=1&size=20');
            const records = data.records || [];
            $('receivedHint').textContent = '共 ' + (data.total || 0) + ' 条';
            $('receivedList').innerHTML = records.length ? records.map(msg => `
                <div class="message ${msg.isRead ? '' : 'unread'}">
                    <div class="message-meta">
                        <span class="who">${avatarHtml(msg.fromAvatar, msg.fromNickName || ('用户 ' + msg.fromUserId))}<b>${esc(msg.fromNickName || ('用户 ' + msg.fromUserId))}</b></span>
                        <time>${formatTime(msg.createTime)}</time>
                    </div>
                    <div class="message-item">商品：${esc(msg.itemTitle || ('#' + msg.itemId))}</div>
                    <div class="message-content">${esc(msg.content)}</div>
                    <div class="message-actions">
                        ${msg.isRead ? '<span class="hint">已读</span>' : `<button class="btn ghost small" data-action="read" data-id="${msg.id}">标为已读</button>`}
                    </div>
                </div>`).join('') : '<div class="empty">还没有收到留言。</div>';
        } catch (e) {
            $('receivedList').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
        }
    }

    async function markRead(id) {
        try {
            await api('/api/message/' + id + '/read', { method: 'PUT' });
            toast('已标为已读', 'success');
            await loadReceived();
            await loadUnreadCount();
        } catch (e) {
            toast(e.message, 'error');
        }
    }

    async function markAllRead() {
        try {
            await api('/api/message/read-all', { method: 'PUT' });
            toast('全部已标为已读', 'success');
            await loadReceived();
            await loadUnreadCount();
        } catch (e) {
            toast(e.message, 'error');
        }
    }

    async function uploadCover(file) {
        if (!state.token) {
            toast('请先登录', 'error');
            showLogin();
            return;
        }
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            toast('请选择图片文件', 'error');
            return;
        }
        if (file.size > 5 * 1024 * 1024) {
            toast('图片不能超过 5MB', 'error');
            return;
        }
        const form = new FormData();
        form.append('file', file);
        $('publishHint').textContent = '封面上传中...';
        try {
            const url = await api('/api/upload/image', { method: 'POST', body: form });
            state.coverImage = url;
            $('coverPreview').hidden = false;
            $('coverPreview').innerHTML = `
                <img src="${esc(url)}" alt="封面预览">
                <button type="button" id="removeCover" class="btn ghost small">移除封面</button>`;
            $('publishHint').textContent = '封面已上传';
            $('removeCover').addEventListener('click', () => {
                state.coverImage = '';
                $('coverPreview').hidden = true;
                $('coverPreview').innerHTML = '';
                $('pCoverFile').value = '';
                $('publishHint').textContent = '封面可不上传；上传后会自动填入';
            });
        } catch (e) {
            $('publishHint').textContent = '封面可不上传；上传后会自动填入';
            toast(e.message, 'error');
        }
    }

    async function publish() {
        if (!state.token) {
            toast('请先登录', 'error');
            showLogin();
            return;
        }
        const title = $('pTitle').value.trim();
        const price = $('pPrice').value.trim();
        const originalPrice = $('pOriginalPrice').value.trim();
        if (!title) {
            toast('标题不能为空', 'error');
            return;
        }
        if (!price || !(Number(price) > 0)) {
            toast('价格必须大于 0', 'error');
            return;
        }
        let categoryId = null;
        if ($('pCategoryId').value.trim()) {
            categoryId = Number($('pCategoryId').value.trim());
            if (!Number.isInteger(categoryId)) {
                toast('分类 id 必须是数字', 'error');
                return;
            }
        }
        const body = {
            title,
            description: $('pDescription').value.trim(),
            price,
            originalPrice: originalPrice || null,
            coverImage: state.coverImage || null,
            school: $('pSchool').value.trim() || null,
            categoryId
        };
        $('publishBtn').disabled = true;
        try {
            const id = await api('/api/item', {
                method: 'POST',
                body: JSON.stringify(body)
            });
            toast('发布成功，商品 id=' + id, 'success');
            $('pTitle').value = '';
            $('pPrice').value = '';
            $('pOriginalPrice').value = '';
            $('pDescription').value = '';
            state.coverImage = '';
            $('coverPreview').hidden = true;
            $('coverPreview').innerHTML = '';
            $('pCoverFile').value = '';
            switchTab('items');
            await loadItems(1);
        } catch (e) {
            toast(e.message, 'error');
        } finally {
            $('publishBtn').disabled = false;
        }
    }

    function handleCardClick(event) {
        const button = event.target.closest('button[data-action]');
        if (!button) {
            const card = event.target.closest('article.item');
            if (card && card.dataset.id) openDetail(Number(card.dataset.id));
            return;
        }
        const id = Number(button.dataset.id);
        if (!id) return;
        if (button.dataset.action === 'unfav') {
            removeFavorite(id);
        } else if (button.dataset.action === 'fav') {
            toggleFavorite(id);
        } else if (button.dataset.action === 'msg') {
            openMessages(id);
        } else if (button.dataset.action === 'order') {
            createOrder(id);
        } else if (button.dataset.action === 'edit-item') {
            const item = state.items.find(x => Number(x.id) === id);
            if (item) openEdit(item);
        } else if (button.dataset.action === 'off-item') {
            const item = state.items.find(x => Number(x.id) === id);
            if (item) changeItemStatus(item, 0);
        } else if (button.dataset.action === 'on-item') {
            const item = state.items.find(x => Number(x.id) === id);
            if (item) changeItemStatus(item, 1);
        }
    }

    function bindEvents() {
        $('authSubmit').addEventListener('click', () => {
            state.authMode === 'login' ? login() : register();
        });
        $('switchAuth').addEventListener('click', () => {
            setAuthMode(state.authMode === 'login' ? 'register' : 'login');
        });
        $('logoutBtn').addEventListener('click', logout);
        $('searchBtn').addEventListener('click', () => loadItems(1));
        $('resetBtn').addEventListener('click', () => {
            $('keyword').value = '';
            $('categoryId').value = '';
            loadItems(1);
        });
        $('keyword').addEventListener('keydown', event => {
            if (event.key === 'Enter') loadItems(1);
        });
        $('prevPage').addEventListener('click', () => loadItems(Math.max(1, state.itemPage - 1)));
        $('nextPage').addEventListener('click', () => loadItems(Math.min(state.itemPages, state.itemPage + 1)));
        $('publishBtn').addEventListener('click', publish);
        $('pCoverFile').addEventListener('change', event => uploadCover(event.target.files[0]));
        $('sendBtn').addEventListener('click', sendMessage);
        $('messageInput').addEventListener('keydown', event => {
            if (event.key === 'Enter') sendMessage();
        });
        $('backToItems').addEventListener('click', () => switchTab('items'));
        document.querySelectorAll('.tab').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });
        $('itemList').addEventListener('click', handleCardClick);
        $('favoriteList').addEventListener('click', handleCardClick);
        $('refreshReceived').addEventListener('click', () => loadReceived());
        $('readAllBtn').addEventListener('click', markAllRead);
        $('receivedList').addEventListener('click', event => {
            const button = event.target.closest('button[data-action="read"]');
            if (button) markRead(Number(button.dataset.id));
        });
        $('boughtBtn').addEventListener('click', () => loadOrders('bought'));
        $('soldBtn').addEventListener('click', () => loadOrders('sold'));
        $('refreshOrders').addEventListener('click', () => loadOrders());
        $('orderList').addEventListener('click', event => {
            const button = event.target.closest('button[data-action]');
            if (!button) return;
            const orderId = Number(button.dataset.id);
            if (button.dataset.action === 'pay-order') goPay(orderId);
            if (button.dataset.action === 'confirm-order') confirmOrder(orderId);
            if (button.dataset.action === 'finish-order') finishOrder(orderId);
            if (button.dataset.action === 'cancel-order') cancelOrder(orderId);
        });
        $('closeDetail').addEventListener('click', closeDetail);
        $('closeEdit').addEventListener('click', closeEdit);
        $('cancelEdit').addEventListener('click', closeEdit);
        $('saveEdit').addEventListener('click', saveEdit);
        $('editModal').addEventListener('click', event => {
            if (event.target === $('editModal')) closeEdit();
        });
        $('detailModal').addEventListener('click', event => {
            if (event.target === $('detailModal')) closeDetail();
        });
        $('detailBody').addEventListener('click', handleDetailAction);
        // 从支付宝标签页切回来时刷新订单，付款后的 pay_status 才能及时显示
        window.addEventListener('focus', () => {
            if (state.token && document.visibilityState === 'visible' && !$('tab-orders').hidden) {
                loadOrders();
            }
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !$('editModal').hidden) closeEdit();
            else if (event.key === 'Escape' && !$('detailModal').hidden) closeDetail();
        });
    }

    setAuthMode('login');
    restoreSession();
    bindEvents();
    loadItems(1);
    if (state.token) {
        loadFavoriteIds().then(renderItems);
        loadUnreadCount();
    }
</script>
</body>
</html>
